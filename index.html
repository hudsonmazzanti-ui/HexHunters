<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f141d" />
    <!-- Fonts: Rajdhani (headings, buttons, numbers) and Inter (body). See src/ui/theme.ts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Rajdhani:wght@600;700&display=swap"
    />
    <title>HexHunters</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar"></header>
      <main id="stage">
        <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="board-tools">
          <button id="btn-fit" class="tool" aria-label="Fit board to screen">⤢</button>
          <button id="btn-menu" class="tool" aria-label="Menu">☰</button>
        </div>
      </main>
      <section id="panel"></section>
    </div>
    <div id="overlay" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
